services:
  mongodb:
    image: mongo:8.3.2
    container_name: app-mongodb-dev
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_dev_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3

  rabbitmq:
    build:
      context: .
      dockerfile: Dockerfile.rabbitmq
    container_name: app-rabbitmq-dev
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app123
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - '5673:5672'
      - '15673:15672'
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

volumes:
  mongodb_dev_data:
  rabbitmq_dev_data:
